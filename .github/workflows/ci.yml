# Verifica en cada Pull Request que el codigo compile (TypeScript) y pase el linter.
name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  verificar-codigo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Ejecutar linter
        run: npm run lint
